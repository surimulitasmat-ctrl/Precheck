<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PreCheck</title>

    <!-- PWA -->
    <meta name="theme-color" content="#009A44" />
    <link rel="manifest" href="/manifest.json?v=20260113a" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- ✅ Prevent theme flash (apply dark before CSS + app render)
         IMPORTANT: we set dark on <html> because <body> isn't ready yet.
    -->
    <script>
      (function () {
        try {
          var v = localStorage.getItem("pc_theme");
          if (v === "dark") document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>

    <!-- Styles -->
    <link rel="stylesheet" href="/style.css?v=20260113a" />
  </head>

  <body>
    <!-- =========================
         TOP BAR
         ========================= -->
 <header class="topbar" id="topbar">
      <div class="topbar-row">
        <button id="btnMenu" class="menu-btn" type="button" aria-label="Open menu">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" style="opacity: 0.95;">
            <path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </button>

        <div class="brand-wrap">
          <div class="brand">PreCheck</div>
          <div id="sessionLine" class="session-line hidden"></div>
        </div>

        <div class="topbar-right">
          <div id="roleHost"></div>
        </div>
      </div>
    </header>
    <!-- =========================
         LEFT DRAWER
         ========================= -->
    <div id="drawerBackdrop" class="drawer-backdrop hidden" aria-hidden="true">
      <aside id="drawer" class="drawer" role="dialog" aria-modal="true" aria-label="Menu">
        <div class="drawer-head">
          <div class="drawer-title">Menu</div>
          <button id="btnDrawerClose" class="icon-btn" type="button" aria-label="Close">✕</button>
        </div>

        <div class="drawer-body">
          <button class="drawer-item big" id="drawerHome" type="button">🏠 Home</button>
          <button class="drawer-item big" id="drawerAlerts" type="button">📦 Stock Alert</button>
          <button class="drawer-item big" id="drawerManager" type="button">👑 Manager</button>
          <button class="drawer-item big" id="drawerSummary" type="button">📊 Summary</button>
          <button class="drawer-item big" id="drawerWISR" type="button">🧾 WISR Count</button>

          <!-- ✅ Keep as a button; app.js will render the switch UI inside -->
          <button id="drawerTheme" class="drawer-item" type="button" aria-pressed="false">
            🌙 Dark mode
          </button>

          <div class="drawer-spacer"></div>

          <button class="drawer-item big danger" id="drawerLogout" type="button">⛔ Logout</button>
        </div>
      </aside>
    </div>

    <!-- =========================
         MAIN CONTENT
         ========================= -->
    <main id="main" class="container"></main>

    <!-- =========================
         MODAL
         ========================= -->
    <div id="modalBackdrop" class="backdrop hidden" aria-hidden="true">
      <div class="modal" role="dialog" aria-modal="true">
        <div class="modal-head">
          <div id="modalTitle" class="modal-title">Modal</div>
          <button id="modalClose" class="icon-btn" type="button" aria-label="Close">✕</button>
        </div>
        <div id="modalBody" class="modal-body"></div>
      </div>
    </div>

    <!-- =========================
         TOAST
         ========================= -->
    <div id="toast" class="toast hidden"></div>

    <!-- =========================
         APP SCRIPT
         ========================= -->
    <script src="/app.js?v=20260113a"></script>
  </body>
</html>
