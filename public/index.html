<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PreCheck</title>

    <!-- PWA -->
    <meta name="theme-color" content="#009A44" />
    <link rel="manifest" href="/manifest.json?v=20260113a" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- ✅ Prevent theme flash (apply dark before CSS + app render)
         IMPORTANT: we set dark on <html> because <body> isn't ready yet.
    -->
    <script>
      (function () {
        try {
          var v = localStorage.getItem("pc_theme");
          if (v === "dark") document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>

    <!-- ✅ Splash critical CSS (so splash looks correct instantly) -->
    <style>
      .pc-splash {
        position: fixed;
        inset: 0;
        background: #0e0f12;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10000;
        opacity: 1;
        transition: opacity 380ms ease;
      }
      .pc-splash-inner {
        text-align: center;
        animation: pcFadeIn 600ms ease-out;
      }
      .pc-watch {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.35);
        position: relative;
        margin: 0 auto;
        animation: pcBreathe 2.8s ease-in-out infinite;
      }
      .pc-watch::before {
        content: "";
        position: absolute;
        top: -10px;
        left: 50%;
        width: 22px;
        height: 12px;
        transform: translateX(-50%);
        border-radius: 8px;
        border: 3px solid rgba(255, 255, 255, 0.35);
        background: transparent;
      }
      .pc-watch::after {
        content: "";
        position: absolute;
        top: 14px;
        left: 50%;
        width: 2px;
        height: 38px;
        background: rgba(255,255,255,0.95);
        transform-origin: bottom;
        transform: translateX(-50%) rotate(-8deg);
        animation: pcHand 1.4s ease-in-out infinite;
        border-radius: 2px;
      }
      .pc-tagline {
        margin-top: 18px;
        display: inline-block;
        padding: 10px 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        font-size: 12.5px;
        font-weight: 650;
        letter-spacing: 0.25px;
        color: rgba(255, 255, 255, 0.70);
        animation: pcTagline 2.8s ease-in-out infinite;
      }

      @keyframes pcBreathe {
        0%,100% { transform: scale(1); }
        50% { transform: scale(1.04); }
      }
      @keyframes pcHand {
        0%,100% { transform: translateX(-50%) rotate(-10deg); }
        50% { transform: translateX(-50%) rotate(10deg); }
      }
      @keyframes pcTagline {
        0% { opacity: 0; transform: translateY(2px); }
        35% { opacity: 1; transform: translateY(0); }
        80% { opacity: 1; transform: translateY(0); }
        100% { opacity: 0; transform: translateY(-1px); }
      }
      @keyframes pcFadeIn {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>

    <!-- Styles -->
    <link rel="stylesheet" href="/style.css?v=20260113a" />
  </head>

  <body>
    <!-- =========================
         TOP BAR
         ========================= -->
    <header class="topbar" id="topbar">
      <div class="topbar-row">
        <!-- Hamburger -->
        <button id="btnMenu" class="menu-btn" type="button" aria-label="Open menu">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path d="M4 6h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
            <path d="M4 12h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
            <path d="M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
          </svg>
        </button>

        <div class="brand-wrap">
          <div class="brand">PreCheck</div>
          <div id="sessionLine" class="session-line hidden"></div>
        </div>

        <div class="topbar-right">
          <!-- role pill injected by app.js -->
          <div id="roleHost"></div>
        </div>
      </div>
    </header>

    <!-- =========================
         LEFT DRAWER
         ========================= -->
    <div id="drawerBackdrop" class="drawer-backdrop hidden" aria-hidden="true">
      <aside id="drawer" class="drawer" role="dialog" aria-modal="true" aria-label="Menu">
        <div class="drawer-head">
          <div class="drawer-title">Menu</div>
          <button id="btnDrawerClose" class="icon-btn" type="button" aria-label="Close">✕</button>
        </div>

        <div class="drawer-body">
          <button class="drawer-item big" id="drawerHome" type="button">🏠 Home</button>
          <button class="drawer-item big" id="drawerAlerts" type="button">📦 Stock Alert</button>
          <button class="drawer-item big" id="drawerManager" type="button">👑 Manager</button>
          <button class="drawer-item big" id="drawerSummary" type="button">📊 Summary</button>
          <button class="drawer-item big" id="drawerWISR" type="button">🧾 WISR Count</button>

          <!-- ✅ Keep as a button; app.js will render the switch UI inside -->
          <button id="drawerTheme" class="drawer-item" type="button" aria-pressed="false">
            🌙 Dark mode
          </button>

          <div class="drawer-spacer"></div>

          <button class="drawer-item big danger" id="drawerLogout" type="button">⛔ Logout</button>
        </div>
      </aside>
    </div>

    <!-- =========================
         MAIN CONTENT
         ========================= -->
    <main id="main" class="container"></main>

    <!-- =========================
         MODAL
         ========================= -->
    <div id="modalBackdrop" class="backdrop hidden" aria-hidden="true">
      <div class="modal" role="dialog" aria-modal="true">
        <div class="modal-head">
          <div id="modalTitle" class="modal-title">Modal</div>
          <button id="modalClose" class="icon-btn" type="button" aria-label="Close">✕</button>
        </div>
        <div id="modalBody" class="modal-body"></div>
      </div>
    </div>

    <!-- =========================
         TOAST
         ========================= -->
    <div id="toast" class="toast hidden"></div>

    <!-- =========================
         APP SCRIPT
         ========================= -->
    <script src="/app.js?v=20260113a"></script>
  </body>
</html>
