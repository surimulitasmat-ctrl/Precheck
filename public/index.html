<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PreCheck</title>

    <meta name="theme-color" content="#009A44" />
    <link rel="manifest" href="/manifest.json?v=20260111a" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <link rel="stylesheet" href="/style.css?v=20260111a" />
  </head>

  <body>
    <!-- TOP BAR -->
    <header class="topbar" id="topbar">
      <div class="topbar-row">
        <button id="btnMenu" class="menu-btn" type="button" aria-label="Open menu">☰</button>

        <div class="brand-wrap">
          <div class="brand">PreCheck</div>
          <div id="sessionLine" class="session-line hidden"></div>
        </div>

        <!-- role badge moved to top right -->
        <div class="topbar-right">
          <button id="rolePill" class="role-pill hidden" type="button" aria-label="Role"></button>
        </div>
      </div>
    </header>

    <!-- LEFT DRAWER -->
    <div id="drawerBackdrop" class="drawer-backdrop hidden" aria-hidden="true">
      <aside id="drawer" class="drawer" role="dialog" aria-modal="true" aria-label="Menu">
        <div class="drawer-head">
          <div class="drawer-title">Menu</div>
          <button id="btnDrawerClose" class="icon-btn" type="button" aria-label="Close">✕</button>
        </div>

        <div class="drawer-body">
          <button class="drawer-item" id="drawerHome" type="button">🏠 Home</button>
          <button class="drawer-item" id="drawerAlerts" type="button">🔔 Alerts</button>
          <button class="drawer-item" id="drawerManager" type="button">🛠️ Manager</button>
          <div class="drawer-sep"></div>
          <button class="drawer-item danger" id="drawerLogout" type="button">🚪 Logout</button>
        </div>
      </aside>
    </div>

    <!-- MAIN -->
    <main id="main" class="container"></main>

    <!-- MODAL -->
    <div id="modalBackdrop" class="backdrop hidden" aria-hidden="true">
      <div class="modal" role="dialog" aria-modal="true">
        <div class="modal-head">
          <div id="modalTitle" class="modal-title">Modal</div>
          <button id="modalClose" class="icon-btn" type="button" aria-label="Close">✕</button>
        </div>
        <div id="modalBody" class="modal-body"></div>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>

    <script src="/app.js?v=20260111a"></script>
  </body>
</html>
