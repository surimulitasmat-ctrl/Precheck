<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#009A44" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>PreCheck</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
</head>
<body>

  <div id="splash" class="splash-screen">
    <div class="splash-content">
      <div class="splash-logo">🥗</div>
      <div class="splash-brand">PreCheck</div>
      <div class="splash-loading-bar">
        <div class="splash-progress"></div>
      </div>
    </div>
  </div>

  <div id="drawerBackdrop" class="drawer-backdrop hidden">
    <aside id="drawer" class="drawer">
      <div class="drawer-head">
        <div class="drawer-title" style="font-size:20px">Menu</div>
        <button id="btnDrawerClose" class="icon-btn" style="background:transparent;box-shadow:none">✕</button>
      </div>
      <div class="drawer-body">
        <button class="drawer-item big" id="drawerHome" type="button">🏠 Home</button>
        <button class="drawer-item big" id="drawerAlerts" type="button">📦 Stock Alert</button>
        <button class="drawer-item big" id="drawerManager" type="button">👑 Manager</button>
        <button class="drawer-item big" id="drawerSummary" type="button">📊 Summary</button>
        <button class="drawer-item big" id="drawerWISR" type="button">📉 WISR (Soon)</button>
        
        <button class="drawer-item big" id="drawerTheme" type="button">🌙 Dark Mode</button>

        <div class="drawer-spacer"></div>
        <button class="drawer-item big danger" id="drawerLogout" type="button">⛔ Logout</button>
      </div>
    </aside>
  </div>

  <header class="topbar" id="topbar">
    <div class="topbar-row">
      <button id="btnMenu" class="menu-btn" type="button">
        <svg viewBox="0 0 24 24" width="28" height="28">
          <path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </button>
      <div class="brand-wrap">
        <div class="brand">PreCheck</div>
        <div id="sessionLine" class="session-line"></div>
      </div>
      <div class="topbar-right">
        <div id="roleHost"></div>
      </div>
    </div>
  </header>

  <main id="main" class="container"></main>

  <div id="modalBackdrop" class="backdrop hidden">
    <div class="modal">
      <div class="modal-head">
        <div class="modal-title" id="modalTitle"></div>
        <button id="modalClose" class="icon-btn" style="background:transparent;box-shadow:none">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
