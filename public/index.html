<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PreCheck</title>

    <!-- PWA -->
    <meta name="theme-color" content="#009A44" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- Styles -->
    <link rel="stylesheet" href="/style.css" />
  </head>

  <body>

    <!-- =========================
         SPLASH SCREEN
         ========================= -->
    <div id="pcSplash" class="pc-splash">
      <div class="pc-splash-inner">
        <div class="pc-watch">
          <div class="pc-glow"></div>
          <div class="pc-face">
            <div class="pc-hand"></div>
            <div class="pc-pin"></div>
          </div>
          <div class="pc-crown"></div>
          <div class="pc-btn pc-btn-l"></div>
          <div class="pc-btn pc-btn-r"></div>
        </div>

        <div class="pc-tagline">Let’s work toward 0% expiry</div>
      </div>
    </div>

    <!-- =========================
         TOP BAR
         ========================= -->
    <header class="topbar" id="topbar">
      <div class="topbar-row">
        <button id="btnMenu" class="menu-btn" type="button">☰</button>
        <div class="brand-wrap">
          <div class="brand">PreCheck</div>
          <div id="sessionLine" class="session-line hidden"></div>
        </div>
        <div id="roleHost"></div>
      </div>
    </header>

    <!-- =========================
         DRAWER
         ========================= -->
    <div id="drawerBackdrop" class="drawer-backdrop hidden">
      <aside class="drawer">
        <button id="drawerHome">Home</button>
        <button id="drawerAlerts">Stock Alert</button>
        <button id="drawerManager">Manager</button>
        <button id="drawerSummary">Summary</button>
        <button id="drawerLogout">Logout</button>
      </aside>
    </div>

    <!-- =========================
         MAIN CONTENT
         ========================= -->
    <main id="main"></main>

    <!-- =========================
         MODAL
         ========================= -->
    <div id="modalBackdrop" class="backdrop hidden">
      <div class="modal">
        <div class="modal-head">
          <div id="modalTitle">Modal</div>
          <button id="modalClose">✕</button>
        </div>
        <div id="modalBody"></div>
      </div>
    </div>

    <!-- =========================
         TOAST
         ========================= -->
    <div id="toast" class="toast hidden"></div>

    <!-- =========================
         APP SCRIPT
         ========================= -->
    <script src="/app.js"></script>

  </body>
</html>
